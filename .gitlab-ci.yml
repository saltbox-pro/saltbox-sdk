---

include:
  - project: 'saltbox/ci-lib'
    file: 'def-branch-merge-guard.yml'

ruff:
  stage: test
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev,rest,mongo,redis,event-bus,taskiq]
  script:
    ruff check saltbox_sdk
  cache:
    paths:
      - '.cache/pip/'

mypy:
  stage: test
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install -e .[dev,rest,mongo,redis,event-bus,taskiq]
  script:
    mypy saltbox_sdk
  cache:
    paths:
      - '.cache/pip/'
