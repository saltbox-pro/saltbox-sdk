name: CI


on:
  pull_request


jobs:
  export-pr-number:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event.pull_request.number }}" > pr_number.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr_number.txt

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev,rest,mongo,redis,event-bus,taskiq]
      - run: ruff check saltbox_sdk


  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev,rest,mongo,redis,event-bus,taskiq]
      - run: mypy saltbox_sdk
