name: CI


on:
  pull_request


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev,rest,mongo,redis,event-bus,taskiq]
      - run: ruff check saltbox_sdk


  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .[dev,rest,mongo,redis,event-bus,taskiq]
      - run: mypy saltbox_sdk
